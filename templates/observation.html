<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Observation</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', path='css/style.css') }}" rel="stylesheet">
</head>
<body>
  <main class="container-fluid px-0 py-0">
    <div class="row g-0">
      <aside class="col-2 editor-sidebar border-end p-4">
        <a class="link-secondary text-decoration-none d-inline-block mb-4" href="{{ url_for('index') }}">
          <span aria-hidden="true">←</span> Observations
        </a>

        <h1 class="h5 mb-1" id="observationSatellite">Observation</h1>
        <p class="small text-secondary mb-4" id="observationMetadata">Loading…</p>

        <form id="editorForm">
          <fieldset class="mb-4">
            <legend class="editor-section-title">Display</legend>
            <div class="d-flex gap-3 mb-3">
              <div class="form-check">
                <input class="form-check-input" type="radio" name="displayMode" id="modeChannel" value="channel" checked>
                <label class="form-check-label" for="modeChannel">Channel</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="radio" name="displayMode" id="modeComposite" value="composite">
                <label class="form-check-label" for="modeComposite">Composite</label>
              </div>
            </div>

            <div id="channelControls">
              <label class="form-label small mb-1" for="channelSelect">Channel</label>
              <select class="form-select form-select-sm" id="channelSelect">
                <option value="1">Channel 1</option>
                <option value="2">Channel 2</option>
                <option value="3">Channel 3</option>
                <option value="4">Channel 4</option>
              </select>
            </div>

            <div id="compositeControls" class="d-none">
              <label class="form-label small mb-1" for="compositeSelect">Composite</label>
              <select class="form-select form-select-sm" id="compositeSelect">
                <option value="122">122</option>
                <option value="123">123</option>
                <option value="natural_color">Natural color</option>
                <option value="thermal_infrared">Thermal infrared</option>
                <option value="custom">Custom</option>
              </select>
              <div id="customCompositeWrap" class="mt-2 d-none">
                <label class="form-label small mb-1" for="customComposite">Custom combination</label>
                <input class="form-control form-control-sm" id="customComposite" type="text" placeholder="e.g. 321" autocomplete="off">
              </div>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="editor-section-title">Processing</legend>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="geocorrection">
              <label class="form-check-label" for="geocorrection">Geocorrection</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="rotate180">
              <label class="form-check-label" for="rotate180">Rotate 180°</label>
            </div>
          </fieldset>

          <fieldset class="mb-4">
            <legend class="editor-section-title">Overlays</legend>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="showMap">
              <label class="form-check-label" for="showMap">Show map</label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="showCityLabels">
              <label class="form-check-label" for="showCityLabels">Show city labels</label>
            </div>
          </fieldset>

          <button id="applyButton" class="btn btn-primary w-100" type="submit">Apply</button>
        </form>
      </aside>

      <section class="col-10 px-4 py-4">
        <div class="d-flex justify-content-between align-items-start gap-2 mb-3">
          <div>
            <h2 class="h5 mb-1">Image viewer</h2>
            <p class="small text-secondary mb-0" id="viewerSummary">Channel 1</p>
          </div>
          <div class="small text-secondary text-end" id="renderStatus" role="status" aria-live="polite">Loading…</div>
        </div>

        <div class="viewer-shell">
          <div class="viewer-toolbar">
            <button type="button" class="btn btn-sm btn-outline-secondary" id="zoomOut" title="Zoom out (−)">−</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="zoomIn" title="Zoom in (+)">+</button>
            <button type="button" class="btn btn-sm btn-outline-secondary" id="resetView">Reset view</button>
            <span class="small text-secondary ms-2" id="zoomLevel">100%</span>
            <span class="small text-secondary ms-auto">Scroll to zoom · Drag to pan · Arrow keys to move</span>
          </div>
          <div id="viewerViewport" class="viewer-viewport" tabindex="0">
            <img id="mainImage" class="viewer-image" alt="" draggable="false">
            <div id="viewerEmpty" class="viewer-empty-state">Loading…</div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <script>
    window.VIEWLRPT_CONFIG = {
      observationId: {{ observation_id | default('', true) | tojson }}
    };
  </script>
  <script src="{{ url_for('static', path='js/funcs.js') }}"></script>
  <script>
    (function () {
      "use strict";
      const api = window.ViewLRPT;
      const observationId = (window.VIEWLRPT_CONFIG || {}).observationId
        || new URLSearchParams(window.location.search).get("id")
        || "";

      const form = document.getElementById("editorForm");
      const modeChannel = document.getElementById("modeChannel");
      const modeComposite = document.getElementById("modeComposite");
      const channelSelect = document.getElementById("channelSelect");
      const compositeSelect = document.getElementById("compositeSelect");
      const customComposite = document.getElementById("customComposite");
      const customCompositeWrap = document.getElementById("customCompositeWrap");
      const channelControls = document.getElementById("channelControls");
      const compositeControls = document.getElementById("compositeControls");
      const geocorrection = document.getElementById("geocorrection");
      const rotate180 = document.getElementById("rotate180");
      const showMap = document.getElementById("showMap");
      const showCityLabels = document.getElementById("showCityLabels");
      const applyButton = document.getElementById("applyButton");
      const image = document.getElementById("mainImage");
      const viewport = document.getElementById("viewerViewport");
      const status = document.getElementById("renderStatus");
      const emptyState = document.getElementById("viewerEmpty");
      const zoomLabel = document.getElementById("zoomLevel");
      const summary = document.getElementById("viewerSummary");

      let currentObjectUrl = null;
      let scale = 1;
      let translateX = 0;
      let translateY = 0;
      let isPanning = false;
      let panStartX = 0;
      let panStartY = 0;
      let lastPointer = { x: 0, y: 0 };

      function collectSettings() {
        const mode = modeComposite.checked ? "composite" : "channel";
        return {
          display_mode: mode,
          channel: Number(channelSelect.value),
          composite: compositeSelect.value,
          custom_composite: customComposite.value.trim(),
          geocorrection: geocorrection.checked,
          rotate_180: rotate180.checked,
          show_map: showMap.checked,
          show_city_labels: showCityLabels.checked
        };
      }

      function buildPayload(s) {
        return {
          display_mode: s.display_mode,
          channel: s.display_mode === "channel" ? s.channel : null,
          composite: s.display_mode === "composite" ? s.composite : null,
          custom_composite: s.display_mode === "composite" && s.composite === "custom" ? s.custom_composite : null,
          geocorrection: s.geocorrection,
          rotate_180: s.rotate_180,
          map: s.show_map,
          labels: s.show_city_labels
        };
      }

      function updateControlVisibility() {
        channelControls.classList.toggle("d-none", !modeChannel.checked);
        compositeControls.classList.toggle("d-none", !modeComposite.checked);
        customCompositeWrap.classList.toggle("d-none", !modeComposite.checked || compositeSelect.value !== "custom");
      }

      function labelForSettings(s) {
        if (s.display_mode === "channel") return "Channel " + s.channel;
        const names = { "122": "Composite 122", "123": "Composite 123", natural_color: "Natural color", thermal_infrared: "Thermal infrared" };
        if (s.composite === "custom") return "Custom composite " + (s.custom_composite || "(not set)");
        return names[s.composite] || "Composite";
      }

      function setViewerImage(blob) {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = URL.createObjectURL(blob);
        image.src = currentObjectUrl;
        emptyState.classList.add("d-none");
      }

      async function loadImage(url, options, pendingText) {
        status.textContent = pendingText;
        emptyState.classList.remove("d-none");
        emptyState.textContent = pendingText;
        try {
          const response = await fetch(url, options || {});
          if (!response.ok) throw new Error("Image API returned " + response.status);
          setViewerImage(await response.blob());
          status.textContent = "Loaded";
        } catch (_error) {
          emptyState.textContent = "Image could not be loaded.";
          status.textContent = "Error";
        }
      }

      function loadRawChannel() {
        const s = collectSettings();
        loadImage(
          api.renderImageUrl(observationId),
          {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "image/png" },
            body: JSON.stringify(buildPayload(s))
          },
          "Loading channel " + s.channel + "…"
        );
        summary.textContent = "Channel " + s.channel;
      }

      function applyProcessing(event) {
        if (event) event.preventDefault();
        const s = collectSettings();
        applyButton.disabled = true;
        applyButton.textContent = "Processing…";

        loadImage(
          api.renderImageUrl(observationId),
          {
            method: "POST",
            headers: { "Content-Type": "application/json", Accept: "image/png" },
            body: JSON.stringify(buildPayload(s))
          },
          "Requesting processed image…"
        ).finally(function () {
          applyButton.disabled = false;
          applyButton.textContent = "Apply";
          summary.textContent = labelForSettings(s);
        });
      }

      function updateTransform() {
        image.style.transform = "translate(" + translateX + "px, " + translateY + "px) scale(" + scale + ")";
        zoomLabel.textContent = Math.round(scale * 100) + "%";
      }

      function zoomAt(factor, point) {
        const oldScale = scale;
        const nextScale = Math.max(0.2, Math.min(12, oldScale * factor));
        const px = point ? point.x : viewport.clientWidth / 2;
        const py = point ? point.y : viewport.clientHeight / 2;
        translateX = px - ((px - translateX) / oldScale) * nextScale;
        translateY = py - ((py - translateY) / oldScale) * nextScale;
        scale = nextScale;
        updateTransform();
      }

      function panBy(dx, dy) {
        translateX += dx;
        translateY += dy;
        updateTransform();
      }

      modeChannel.addEventListener("change", updateControlVisibility);
      modeComposite.addEventListener("change", updateControlVisibility);
      compositeSelect.addEventListener("change", updateControlVisibility);
      showMap.addEventListener("change", function () {
        if (showMap.checked) geocorrection.checked = true;
      });
      showCityLabels.addEventListener("change", function () {
        if (showCityLabels.checked) geocorrection.checked = true;
      });
      form.addEventListener("submit", applyProcessing);

      document.getElementById("zoomIn").addEventListener("click", function () { zoomAt(1.25, lastPointer); });
      document.getElementById("zoomOut").addEventListener("click", function () { zoomAt(1 / 1.25, lastPointer); });
      document.getElementById("resetView").addEventListener("click", function () {
        scale = 1; translateX = 0; translateY = 0; updateTransform();
      });

      viewport.addEventListener("pointermove", function (event) {
        const rect = viewport.getBoundingClientRect();
        lastPointer = { x: event.clientX - rect.left, y: event.clientY - rect.top };
        if (isPanning) {
          translateX += event.clientX - panStartX;
          translateY += event.clientY - panStartY;
          panStartX = event.clientX;
          panStartY = event.clientY;
          updateTransform();
        }
      });
      viewport.addEventListener("pointerdown", function (event) {
        if (event.button !== 0) return;
        isPanning = true;
        panStartX = event.clientX;
        panStartY = event.clientY;
        viewport.classList.add("is-dragging");
        viewport.focus({ preventScroll: true });
        try { viewport.setPointerCapture(event.pointerId); } catch (_error) {}
      });
      function stopPanning() {
        isPanning = false;
        viewport.classList.remove("is-dragging");
      }
      viewport.addEventListener("pointerup", stopPanning);
      viewport.addEventListener("pointercancel", stopPanning);
      viewport.addEventListener("lostpointercapture", stopPanning);
      viewport.addEventListener("wheel", function (event) {
        event.preventDefault();
        const rect = viewport.getBoundingClientRect();
        lastPointer = { x: event.clientX - rect.left, y: event.clientY - rect.top };
        zoomAt(event.deltaY < 0 ? 1.12 : 1 / 1.12, lastPointer);
      }, { passive: false });

      document.addEventListener("keydown", function (event) {
        const target = event.target;
        if (target && (target.matches("input, select, textarea, button") || target.isContentEditable)) return;
        if (event.ctrlKey || event.metaKey || event.altKey) return;
        if (event.key === "Enter") { event.preventDefault(); applyProcessing(); return; }
        if (event.key === "+" || event.key === "=") { event.preventDefault(); zoomAt(1.25, lastPointer); }
        else if (event.key === "-") { event.preventDefault(); zoomAt(1 / 1.25, lastPointer); }
        else if (event.key === "ArrowLeft") { event.preventDefault(); panBy(40, 0); }
        else if (event.key === "ArrowRight") { event.preventDefault(); panBy(-40, 0); }
        else if (event.key === "ArrowUp") { event.preventDefault(); panBy(0, 40); }
        else if (event.key === "ArrowDown") { event.preventDefault(); panBy(0, -40); }
      });

      window.addEventListener("beforeunload", function () {
        if (currentObjectUrl) URL.revokeObjectURL(currentObjectUrl);
      });

      if (!observationId) {
        status.textContent = "No observation selected.";
        emptyState.textContent = "No observation selected.";
        return;
      }

      updateControlVisibility();
      updateTransform();

      api.getObservation(observationId).then(function (item) {
        document.getElementById("observationSatellite").textContent = item.satellite_name || "Observation";
        document.getElementById("observationMetadata").textContent =
          "NORAD " + (item.norad_id == null ? "—" : item.norad_id) +
          " · " + api.formatUtc(item.timestamp_utc) + " UTC" +
          " · " + api.formatInteger(item.line_count) + " lines";
        loadRawChannel();
      }).catch(function () {
        status.textContent = "Observation not found.";
        emptyState.textContent = "Observation not found.";
      });
    }());
  </script>
</body>
</html>
